name: Create Keystore (one-time)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Secret KEYSTORE_PASSWORD is not set"; exit 1; fi
          keytool -genkeypair -v -keystore release.keystore -alias nazholux \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD \
            -dname "CN=Nazholux, O=Nazholux, C=IR"
          base64 -w0 release.keystore > keystore_base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nazholux-keystore
          path: |
            release.keystore
            keystore_base64.txt
          retention-days: 1
